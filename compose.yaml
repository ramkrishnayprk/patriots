name: movie-rag

services:
  frontend:
    build:
      context: ./frontend
      target: runner
    environment:
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:5000
      BACKEND_RUN_ID: ${BACKEND_RUN_ID:-}
      CHAT_MODEL_ID: ${OPENAI_MODEL:-gpt-5.6-terra}
      CHAT_MODEL_IDS: ${OPENAI_ALLOWED_MODELS:-gpt-4.1-mini,gpt-5.6-terra,gpt-5.6-luna}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    ports:
      - "5001:5000"
    volumes:
      - ./backend/data:/app/data
      - embedding-models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      target: runtime
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "acquisition"]
    env_file: .env
    volumes:
      - ./backend/data:/app/data
      - embedding-models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  embedding-model-download:
    profiles: ["model"]
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.embedding.download"]
    env_file: .env
    volumes:
      - embedding-models:/models

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    command: ["pytest", "-q"]
    environment:
      REDIS_URL: redis://redis:6379/15
      DATA_DIR: /tmp/test-data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  embedding-models:
